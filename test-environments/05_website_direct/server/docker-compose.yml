# Production deployment of the 05_website_direct folder: Node app + Caddy with TLS.
# docs/IDENTITY.md §2, improvement A.  The pattern is the same as test-environments/00_demo/server.
#
#   cp .env.example .env
#   cp wallet.example.json wallet.json
#   # enter your domain in the Caddyfile
#   docker compose up -d
#
# For Wireshark proof: uncomment `ports` on the x402-website-direct service and
# access it via http://<IP>:8080 (bypassing TLS) — see ../../README.md.
#
# Do NOT set COOKIE_SECURE=true if you will also use this open HTTP access:
# the browser will not store a cookie with the `Secure` flag over plain HTTP, so
# the login would go round in circles. The default detection is right for both —
# behind Caddy (X-Forwarded-Proto: https) it adds `Secure` automatically, on port 8080 it does not.

name: x402-neposredno

services:
  x402-website-direct:
    build: .
    image: x402-website-direct:latest
    container_name: x402-website-direct
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./wallet.json:/app/wallet.json:ro
    expose:
      - "8080"
    # Uncomment only for capture over plain HTTP (LAN/loopback):
    # ports:
    #   - "8080:8080"
    networks:
      - x402-net

  caddy:
    image: caddy:2-alpine
    container_name: x402-spletisce-neposredno-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - x402-website-direct
    networks:
      - x402-net

networks:
  x402-net:

volumes:
  caddy_data:
  caddy_config:
