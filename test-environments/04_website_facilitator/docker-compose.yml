# ─────────────────────────────────────────────────────────────────────────────
#  Production deployment of the 04_website_facilitator folder — FACILITATOR BRANCH
#
#  Three services instead of one, because the merchant and the facilitator are
#  SEPARATE PROCESSES. That is exactly what separates topology (b) from (a): if
#  they lived in the same process, there would be no extra hops and the latency
#  measurements would measure nothing.
#
#    facilitator  — the only one with chain access (JSON-RPC), port 4000
#    merchant    — the website and all three flows, no chain access, port 8081
#    caddy      — TLS for public access
#
#  Startup:
#    cp facilitator/.env.example facilitator/.env
#    cp server/.env.example  server/.env
#    cp server/wallet.example.json server/wallet.json
#    # enter your domain in the Caddyfile
#    docker compose up -d facilitator
#    grep TOKEN facilitator/data/admin-credentials.txt     # → FACILITATOR_TOKEN in server/.env
#    docker compose up -d
#
#  The project name is explicit: by default Compose would derive it from the
#  folder name, and this branch would silently share the network and volumes
#  with the 05_website_direct folder.
#
#  For Wireshark proof, uncomment `ports` on BOTH services and capture traffic
#  on 8081 (client↔merchant) and 4000 (client/merchant↔facilitator).
#  Only both together show all 5 exchanges of the facilitator flow — see ../README.md.
# ─────────────────────────────────────────────────────────────────────────────

name: x402-facilitator

services:
  facilitator:
    build: ./facilitator
    image: x402-facilitator:latest
    container_name: x402-facilitator
    restart: unless-stopped
    env_file:
      - ./facilitator/.env
    volumes:
      - ./facilitator/data:/app/data
    expose:
      - "4000"
    # The payer (browser or external agent) sends /submit-payment STRAIGHT here,
    # so the facilitator must be reachable from outside whenever the payer is not on this host.
    # ports:
    #   - "4000:4000"
    networks:
      - x402-net

  merchant:
    build: ./server
    image: x402-website-facilitator:latest
    container_name: x402-website-facilitator
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Inside the Compose network the facilitator is reachable by its service name.
      FACILITATOR_URL: http://facilitator:4000
    volumes:
      - ./server/data:/app/data
      - ./server/wallet.json:/app/wallet.json:ro
    expose:
      - "8081"
    # Uncomment only for capture over plain HTTP (LAN/loopback):
    # ports:
    #   - "8081:8081"
    depends_on:
      - facilitator
    networks:
      - x402-net

  caddy:
    image: caddy:2-alpine
    container_name: x402-facilitator-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - merchant
    networks:
      - x402-net

networks:
  x402-net:

volumes:
  caddy_data:
  caddy_config:
