name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demo:
    name: Demo web environment (402 → 200)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test-environments/00_demo/server/package-lock.json

      - name: Install server dependencies
        working-directory: test-environments/00_demo/server
        run: npm ci

      # generate-wallet.js uses `ethers` from this folder's root package.json.
      - name: Install wallet generator
        working-directory: test-environments/00_demo
        run: npm ci

      - name: Create test wallets
        working-directory: test-environments/00_demo
        run: node generate-wallet.js

      - name: Start server in background
        working-directory: test-environments/00_demo/server
        env:
          NODE_ENV: production
          MERCHANT_PORT: 3000
          NETWORK: sepolia
          RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          ALLOWED_ORIGINS: http://localhost:3000
          LOG_LEVEL: warn
        run: |
          nohup node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "Server responded after ${i}s"
              exit 0
            fi
            # /health returns 503 when the public RPC node is unreachable — good enough for CI.
            if curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/health 2>/dev/null | grep -q '503'; then
              echo "Server is up (503 = RPC unreachable, acceptable in CI)"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat server.log
          exit 1

      - name: GET /service must return 402
        working-directory: test-environments/00_demo/server
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/service)
          if [ "$STATUS" != "402" ]; then
            echo "Expected 402, got $STATUS"
            cat server.log
            exit 1
          fi

      - name: Web client is served
        run: curl -fsS http://localhost:3000/ | grep -q 'X402'

      - name: Full flow in mock mode
        working-directory: test-environments/00_demo
        run: |
          kill "$(cat server/server.pid)" || true
          sleep 1
          cd server
          MOCK_VERIFY=true nohup node server.js > server-mock.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health >/dev/null 2>&1 && break
            sleep 1
          done
          cd ../client
          npm ci
          npm run mock

      - name: Stop server
        if: always()
        working-directory: test-environments/00_demo/server
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi

  environment-01:
    name: Measurement environment 01 (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start environment-01 server
        working-directory: test-environments/01_one_time_payments/server
        run: |
          npm ci
          cp .env.example .env
          cp wallet.example.json wallet.json
          MOCK_VERIFY=true nohup node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/config >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Server failed to start"; cat server.log; exit 1

      - name: Measurement client (mock)
        working-directory: test-environments/01_one_time_payments/client
        run: |
          npm ci
          node measurement_client.js --runs 3
          test -f ../measurements/one_time_mock.csv

      - name: Security tests
        working-directory: test-environments/01_one_time_payments/client
        run: npm run security

      - name: Stop server
        if: always()
        working-directory: test-environments/01_one_time_payments/server
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
