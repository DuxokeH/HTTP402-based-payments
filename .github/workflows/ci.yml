name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demo:
    name: Testno spletno okolje (402 → 200)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testna-okolja/00_demo/server/package-lock.json

      - name: Namesti odvisnosti strežnika
        working-directory: testna-okolja/00_demo/server
        run: npm ci

      # generate-wallet.js uporablja `ethers` iz korenskega package.json te mape.
      - name: Namesti generator denarnic
        working-directory: testna-okolja/00_demo
        run: npm ci

      - name: Ustvari testni denarnici
        working-directory: testna-okolja/00_demo
        run: node generate-wallet.js

      - name: Zaženi strežnik v ozadju
        working-directory: testna-okolja/00_demo/server
        env:
          NODE_ENV: production
          MERCHANT_PORT: 3000
          NETWORK: sepolia
          RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          ALLOWED_ORIGINS: http://localhost:3000
          LOG_LEVEL: warn
        run: |
          nohup node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "Strežnik se je odzval po ${i}s"
              exit 0
            fi
            # /health vrne 503, če javno vozlišče RPC ni dosegljivo — za CI je to dovolj.
            if curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/health 2>/dev/null | grep -q '503'; then
              echo "Strežnik teče (503 = RPC nedosegljiv, v CI sprejemljivo)"
              exit 0
            fi
            sleep 1
          done
          echo "Strežnik se ni zagnal"
          cat server.log
          exit 1

      - name: GET /service mora vrniti 402
        working-directory: testna-okolja/00_demo/server
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/service)
          if [ "$STATUS" != "402" ]; then
            echo "Pričakovano 402, dobljeno $STATUS"
            cat server.log
            exit 1
          fi

      - name: Spletni odjemalec se postreže
        run: curl -fsS http://localhost:3000/ | grep -q 'X402'

      - name: Celoten tok v mock načinu
        working-directory: testna-okolja/00_demo
        run: |
          kill "$(cat server/server.pid)" || true
          sleep 1
          cd server
          MOCK_VERIFY=true nohup node server.js > server-mock.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health >/dev/null 2>&1 && break
            sleep 1
          done
          cd ../klient
          npm ci
          npm run mock

      - name: Ustavi strežnik
        if: always()
        working-directory: testna-okolja/00_demo/server
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi

  okolje-01:
    name: Merilno okolje 01 (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Zaženi strežnik scenarija 01
        working-directory: testna-okolja/01_enkratna_placila/streznik
        run: |
          npm ci
          cp .env.example .env
          cp wallet.example.json wallet.json
          MOCK_VERIFY=true nohup node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/config >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Strežnik se ni zagnal"; cat server.log; exit 1

      - name: Merilni klient (mock)
        working-directory: testna-okolja/01_enkratna_placila/klient
        run: |
          npm ci
          node merilni_klient.js --runs 3
          test -f ../meritve/enkratna_mock.csv

      - name: Varnostni testi
        working-directory: testna-okolja/01_enkratna_placila/klient
        run: npm run security

      - name: Ustavi strežnik
        if: always()
        working-directory: testna-okolja/01_enkratna_placila/streznik
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
